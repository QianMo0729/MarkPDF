name: Installer release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag for a Windows draft; upload the locally signed Mac package before publishing'
        required: true
        default: 'v0.1.4'
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/src-tauri/target-release
    defaults:
      run:
        shell: pwsh
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target-release
          key: windows-asr-only-rust-1.98.1-${{ hashFiles('app/src-tauri/Cargo.lock', 'app/src-tauri/vendor/sherpa-onnx-sys/build.rs') }}
      - name: Prepare portable native-library configuration
        run: ./scripts/build-windows.ps1 -PrepareOnly
      - name: Install locked frontend dependencies
        run: npm.cmd ci
      - name: Check tag, manifests and release notes
        id: release_metadata
        run: node scripts/check-release-version.mjs --tag "$env:RELEASE_TAG" --github-output
      - name: Verify pinned translation engine
        run: node scripts/download-translation-assets.mjs
      - name: Frontend tests and build
        run: |
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run build
      - name: Rust tests with locked dependencies
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml
      - name: Build NSIS installer and upload to a draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ env.RELEASE_TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseName: MarkPDF ${{ steps.release_metadata.outputs.version }}
          releaseBody: ${{ steps.release_metadata.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadPlainBinary: false
          args: --ci --bundles nsis -- --locked
      - name: Add checksum to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/verify-asr-link.ps1
          ./scripts/write-checksums.ps1
          $checksums = Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis/SHA256SUMS.txt'
          gh release upload "$env:RELEASE_TAG" "$checksums" --repo "$env:GITHUB_REPOSITORY" --clobber
      - name: Retain installer and checksum as workflow artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: MarkPDF-${{ steps.release_metadata.outputs.version }}-windows-x64
          path: |
            app/src-tauri/target-release/release/bundle/nsis/MarkPDF_${{ steps.release_metadata.outputs.version }}_x64-setup.exe
            app/src-tauri/target-release/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # Runs after the Windows job so the draft release it created already exists.
  # Manual runs leave a Windows draft ready for the locally signed/notarized Mac package.
  release-macos:
    if: github.event_name == 'push'
    name: macOS disk image
    needs: release
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/src-tauri/target-release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target-release
          key: macos-arm64-asr-only-rust-1.98.1-${{ hashFiles('app/src-tauri/Cargo.lock', 'app/src-tauri/vendor/sherpa-onnx-sys/build.rs') }}
      - name: Check tag, manifests and release notes
        id: release_metadata
        run: node scripts/check-release-version.mjs --tag "$RELEASE_TAG" --github-output
      - name: Test, build the Apple silicon disk image, audit the native link
        run: ./scripts/build-macos.sh --target aarch64-apple-darwin
      - name: Add disk image and checksum to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          cd "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/dmg"
          gh release upload "$RELEASE_TAG" "MarkPDF_${RELEASE_VERSION}_aarch64.dmg" SHA256SUMS-macos.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: Retain disk image and checksum as workflow artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: MarkPDF-${{ steps.release_metadata.outputs.version }}-macos-arm64
          path: |
            app/src-tauri/target-release/aarch64-apple-darwin/release/bundle/dmg/MarkPDF_${{ steps.release_metadata.outputs.version }}_aarch64.dmg
            app/src-tauri/target-release/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 14

  # Public only once every platform's installer and checksum are attached.
  publish:
    if: github.event_name == 'push'
    name: Publish the completed release
    needs: [release, release-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
