<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS app icon grid: 824 x 824 tile centered on a 1024 canvas, 185 corner radius, soft drop shadow. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A86FF"/>
      <stop offset="1" stop-color="#3148CC"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1FA"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1A66" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tileShadow)"/>
  <g filter="url(#pageShadow)">
    <path d="M328 212 H612 L732 332 V776 a36 36 0 0 1 -36 36 H328 a36 36 0 0 1 -36 -36 V248 a36 36 0 0 1 36 -36 Z" fill="url(#page)"/>
  </g>
  <path d="M612 212 V296 a36 36 0 0 0 36 36 H732 Z" fill="#CBD3EE"/>
  <rect x="352" y="372" width="200" height="30" rx="15" fill="#2B3150"/>
  <rect x="338" y="440" width="356" height="62" rx="16" fill="#FFD60A"/>
  <rect x="352" y="460" width="328" height="22" rx="11" fill="#2B3150" fill-opacity="0.82"/>
  <rect x="352" y="540" width="300" height="22" rx="11" fill="#C3CAE0"/>
  <rect x="352" y="590" width="236" height="22" rx="11" fill="#C3CAE0"/>
  <g fill="#FF453A">
    <rect x="352" y="700" width="18" height="30" rx="9"/>
    <rect x="390" y="684" width="18" height="62" rx="9"/>
    <rect x="428" y="666" width="18" height="98" rx="9"/>
    <rect x="466" y="690" width="18" height="50" rx="9"/>
    <rect x="504" y="656" width="18" height="118" rx="9"/>
    <rect x="542" y="678" width="18" height="74" rx="9"/>
    <rect x="580" y="696" width="18" height="38" rx="9"/>
    <rect x="618" y="672" width="18" height="86" rx="9"/>
    <rect x="656" y="694" width="18" height="42" rx="9"/>
  </g>
</svg>
